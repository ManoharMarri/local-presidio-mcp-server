[project]
name = "presidio-mcp"
version = "1.0.0"
description = "Microsoft Presidio PII detection & anonymization exposed as an MCP server using FastMCP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HR Assistant Team" }]
keywords = ["mcp", "presidio", "pii", "privacy", "anonymization", "fastmcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # MCP Framework
    "fastmcp>=2.0.0,<3.0.0",

    # Presidio core packages
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",

    # NLP engine — spaCy
    "spacy>=3.7.0",

    # Pydantic v2 (FastMCP requires v2)
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",           # for HTTP transport tests
    "ruff>=0.4.0",             # linting
    "mypy>=1.9.0",             # type checking
]

[project.scripts]
presidio-mcp = "presidio_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["presidio_mcp"]

# ---------------------------------------------------------------------------
# Ruff (linting)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]  # line length handled by formatter

# ---------------------------------------------------------------------------
# Mypy (type checking)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
